services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Nokubonga@01"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - techmove_network

  glms-backend-api:
    build:
      context: .
      dockerfile: TechMove.API/Dockerfile
    container_name: glms-backend-api
    environment:
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=TechMoveDB;User=sa;Password=Nokubonga@01;TrustServerCertificate=true;
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharsLong123!
      - Jwt__Issuer=TechMoveAPI
      - Jwt__Audience=TechMoveClient
    ports:
      - "5000:80"
    depends_on:
      - sql-server-db
    networks:
      - techmove_network

  glms-frontend-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glms-frontend-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80          # ✅ forces IPv4 binding
      - ApiBaseUrl=http://glms-backend-api
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=TechMoveDB;User=sa;Password=Nokubonga@01;TrustServerCertificate=true;
    ports:
      - "8080:80"
    depends_on:
      - glms-backend-api
    networks:
      - techmove_network
    volumes:
      - aspnet-keys:/root/.aspnet/DataProtection-Keys   # ✅ persist keys

networks:
  techmove_network:
    driver: bridge

volumes:
  sql_data:
  aspnet-keys: