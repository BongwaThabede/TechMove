version: '3.8'

services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - techmove_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong!Password123 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s

  glms-backend-api:
    build:
      context: .
      dockerfile: TechMove.API/Dockerfile
    container_name: glms-backend-api
    environment:
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=TechMoveDB;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharsLong123!
      - Jwt__Issuer=TechMoveAPI
      - Jwt__Audience=TechMoveClient
    ports:
      - "5000:80"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - techmove_network

  glms-frontend-web:
    build:
      context: .
      dockerfile: TechMove/Dockerfile
    container_name: glms-frontend-web
    environment:
      - ApiBaseUrl=http://glms-backend-api
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=TechMoveDB;User=sa;Password=YourStrong!Password123;TrustServerCertificate=true;
    ports:
      - "8080:80"
    depends_on:
      - glms-backend-api
    networks:
      - techmove_network

networks:
  techmove_network:
    driver: bridge

volumes:
  sql_data: